# docker compose up -d --build  →  http://localhost:8787 (HOST_PORT=… for another port; put your HTTPS reverse proxy in front)
services:
  tiefenkontakt:
    build: .
    image: tiefenkontakt:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8787}:8787"
    environment:
      # Public address used in account mails (verify / reset links)
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      # Comma-separated callsigns of moderator accounts
      ADMIN: ${ADMIN:-}
      # Outgoing mail (see .env.example for Gmail / iCloud); empty SMTP_HOST = links go to the log
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_TLS_VERIFY: ${SMTP_TLS_VERIFY:-1}
      SMTP_TIMEOUT_S: ${SMTP_TIMEOUT_S:-20}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Tiefenkontakt}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      # Older single-line form, still accepted: smtps://user:pass@host:465
      SMTP_URL: ${SMTP_URL:-}
      # 1 behind an HTTPS proxy (Secure cookie); 0 for plain HTTP on localhost
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # Daily database copy in the data volume (/data/backups), newest 7 kept
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      # Shared replay links (/r/<id>): days kept, total cap, compressed size cap per replay
      REPLAY_KEEP_DAYS: ${REPLAY_KEEP_DAYS:-90}
      REPLAY_MAX_COUNT: ${REPLAY_MAX_COUNT:-5000}
      REPLAY_MAX_BYTES: ${REPLAY_MAX_BYTES:-2000000}
      BACKUP_EVERY_H: ${BACKUP_EVERY_H:-24}
      # Second copy of every backup, on the host (BACKUP_MIRROR_HOST: e.g. a NAS mount)
      BACKUP_MIRROR_DIR: /mirror
      # Bearer token for GET /api/metrics (?format=prom for Prometheus); empty = moderators only
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Seconds between saves of running matches (higher = fewer writes on SD cards)
      MATCH_SAVE_S: ${MATCH_SAVE_S:-5}
      # json = one JSON object per log line (for log collectors)
      LOG_FORMAT: ${LOG_FORMAT:-}
      # ── Voice radio (see .env.example). Without these the browsers talk directly (LAN, open NAT).
      # Own TURN/STUN relay (profile "turn"): turn:<host>:3478?transport=udp,turn:<host>:3478?transport=tcp
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      STUN_URLS: ${STUN_URLS:-}
      # Voice server (profile "sfu"): browsers use /lk on this server, which passes on to LiveKit
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_KEY: ${LIVEKIT_KEY:-}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET:-}
      LIVEKIT_API_URL: http://host.docker.internal:7880
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tiefenkontakt-data:/data
      - ${BACKUP_MIRROR_HOST:-./backup-mirror}:/mirror
    stop_grace_period: 15s

  # TURN/STUN relay for voice radio behind strict routers. Start with COMPOSE_PROFILES=turn.
  # Router: forward UDP+TCP 3478 and UDP 49160–49200 to this host.
  coturn:
    image: coturn/coturn:4.6
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command: >-
      -n --log-file=stdout --no-cli --fingerprint
      --use-auth-secret --static-auth-secret=${TURN_SECRET:-}
      --realm=tiefenkontakt --listening-port=3478 --min-port=49160 --max-port=49200
      --no-tls --no-dtls --no-multicast-peers --user-quota=8 --total-quota=200
      --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255

  # Voice server (selective forwarding): the game server grants talking and listening.
  # Start with COMPOSE_PROFILES=sfu (or turn,sfu). Router: forward TCP 7881 and UDP 7882.
  # All voice traffic is multiplexed on UDP 7882 (load test on the Pi: a port range of 101 ports
  # ran out at about 50 participants, long before the CPU).
  livekit:
    image: livekit/livekit-server:v1.8
    profiles: ["sfu"]
    restart: unless-stopped
    network_mode: host
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_KEY:-}: ${LIVEKIT_SECRET:-}"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: warn
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        room:
          empty_timeout: 300
          max_participants: 12

volumes:
  tiefenkontakt-data:
