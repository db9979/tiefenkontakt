# Typecheck, tests and build on every push and pull request; then the browser end-to-end test; the Docker image is built too.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm -w @tk/client run build
  e2e:
    # Browser tests: headless Chrome over the DevTools protocol (scripts/e2e.mjs and tutorial-e2e.mjs start their own
    # server and Vite on free ports). CHROME_PATH can be set as a repository variable.
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    env:
      CHROME_PATH: ${{ vars.CHROME_PATH || 'google-chrome' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: $CHROME_PATH --version
      - run: npm run e2e
      # Both guided lessons played to the end in the browser (about five minutes, 3× time scale)
      - run: npm run e2e:tutorials
      # Every screen in the dark and the light theme: screenshots plus a contrast check of all text
      - run: npm run theme-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-shots
          path: artifacts/theme-shots
          retention-days: 14
          if-no-files-found: ignore
  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tiefenkontakt:ci .
      - name: Container starts and answers
        run: |
          docker run -d --name tk -p 8787:8787 -e COOKIE_SECURE=0 tiefenkontakt:ci
          for i in $(seq 1 30); do curl -sf localhost:8787/api/health && exit 0; sleep 1; done
          docker logs tk; exit 1
