# A tag v1.2.3 becomes a GitHub release; its notes are the section "## [1.2.3]" of CHANGELOG.md
# (generated from the commits when there is none). The Docker workflow publishes the matching
# image ghcr.io/db9979/tiefenkontakt:1.2.3.
#   git tag v1.2.3 && git push origin v1.2.3
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 { f = 1; next } /^## \[/ || /^\[[0-9]/ { f = 0 } f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then echo "NOTES=--notes-file notes.md" >> "$GITHUB_ENV"; else echo "NOTES=--generate-notes" >> "$GITHUB_ENV"; fi
      - run: gh release create "$GITHUB_REF_NAME" $NOTES --title "Tiefenkontakt $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
